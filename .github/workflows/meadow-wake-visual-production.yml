name: Meadow Wake visual production gate
on:
  push:
    branches: [visual/meadow-wake-production-rebuild]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: meadow-wake-visual-production-${{ github.ref }}
  cancel-in-progress: true
jobs:
  visual-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validate terrain code and renderer integration
        run: |
          node --check src/environment/meadow-wake-living-terrain.js
          node --check src/environment/meadow-wake-terrain-surface-polish.js
          node --check src/visual-game.js
          npm run test:terrain
      - name: Preserve Level 1 gameplay contracts
        run: npm run test:level-one
      - name: Install Chromium terrain-review tooling
        run: |
          npm install --no-save --package-lock=false playwright@1.51.1
          npx playwright install --with-deps chromium
      - name: Assemble the exact commit and capture terrain
        run: |
          mkdir -p /tmp/meadow-wake-site/assets /tmp/meadow-wake-terrain
          cp index.html styles.css /tmp/meadow-wake-site/
          cp -R src vendor data /tmp/meadow-wake-site/
          cp -R assets/exports assets/textures /tmp/meadow-wake-site/assets/
          git rev-parse HEAD > /tmp/meadow-wake-site/BUILD_COMMIT.txt
          (cd /tmp/meadow-wake-site && node "$GITHUB_WORKSPACE/tools/local-preview-server.mjs") > /tmp/meadow-wake-terrain/server.log 2>&1 &
          sleep 2
          HM_CAPTURE_OUTPUT=/tmp/meadow-wake-terrain node tools/capture-meadow-wake-terrain-gate.mjs
      - name: Package the tested playable build
        run: |
          cp tools/local-preview-server.mjs /tmp/meadow-wake-site/preview.mjs
          tar -czf /tmp/meadow-wake-tested-playable.tar.gz -C /tmp/meadow-wake-site .
      - name: Keep terrain visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meadow-wake-terrain-visual-gate
          path: /tmp/meadow-wake-terrain
          retention-days: 7
      - name: Keep tested playable build
        uses: actions/upload-artifact@v4
        with:
          name: meadow-wake-terrain-tested-playable
          path: /tmp/meadow-wake-tested-playable.tar.gz
          retention-days: 7
          compression-level: 0
