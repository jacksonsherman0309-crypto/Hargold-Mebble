name: Full animation visual audit

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-all-listed-animations:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository and large assets
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install audit dependencies
        run: npm install --no-save playwright sharp

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Start the live Hargold and Mebble preview
        shell: bash
        run: |
          npm run preview > /tmp/hargold-mebble-preview.log 2>&1 &
          echo $! > /tmp/hargold-mebble-preview.pid
          for attempt in {1..90}; do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/hargold-mebble-preview.log
          exit 1

      - name: Play and capture every listed animation
        run: node tools/full-animation-visual-audit.mjs

      - name: Print preview diagnostics
        if: always()
        run: cat /tmp/hargold-mebble-preview.log || true

      - name: Upload exhaustive visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-animation-visual-audit-${{ github.sha }}
          path: audit-output
          if-no-files-found: error
          retention-days: 14
