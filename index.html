<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17281d">
  <title>Hargold &amp; Mebble — Meadow Wake 3D</title>
  <script>
    const presentationParameters = new URLSearchParams(location.search);
    if (
      presentationParameters.has('debugPresentation')
      || presentationParameters.has('debugMovement')
      || presentationParameters.has('debugAnimation')
      || presentationParameters.has('animationValidation')
    ) document.documentElement.classList.add('debug-presentation');
  </script>
  <link rel="stylesheet" href="styles.css?v=living-surface-1">
</head>
<body>
  <main class="shell">
    <header class="hud" aria-label="Development status">
      <div><strong>Meadow Wake · World 1-1</strong><span>Twelve handcrafted outdoor rooms · layered 3D Verdant Vale</span></div>
      <div class="runtime-status">
        <span id="test-mode-badge" hidden>FULLY UNLOCKED TEST</span>
        <span id="status">Loading 3D characters…</span>
      </div>
    </header>

    <section class="game-wrap" aria-label="Playable Meadow Wake course">
      <canvas id="game" width="1280" height="720"></canvas>

      <button id="course-menu-button" class="course-menu-button" aria-label="Open course menu" aria-expanded="false">☰</button>
      <div id="course-menu" class="course-menu" hidden>
        <strong>Meadow Wake</strong>
        <span>Course options</span>
        <button data-action="restart">Restart course</button>
        <button data-action="resume">Resume</button>
      </div>

      <div class="controls" aria-label="Touch controls">
        <div class="left-controls">
          <button class="primary-control" data-action="left" aria-label="Move left">◀</button>
          <button class="primary-control" data-action="right" aria-label="Move right">▶</button>
        </div>
        <div class="right-controls">
          <button class="secondary-control" data-action="swap" aria-label="Swap hero">SWAP</button>
          <button class="secondary-control slam" data-action="slam" aria-label="Ground slam while airborne">SLAM</button>
          <button class="secondary-control action" data-action="action" aria-label="Attack or interact">ACTION</button>
          <button class="primary-control jump" data-action="jump" aria-label="Jump, air twirl, double jump, or Mebble glide">JUMP</button>
        </div>
      </div>
    </section>

    <footer>
      Move: A/D or arrows · Jump / twirl / glide: Space/W/↑ · Ground slam or fast fall: S/↓ · Attack: E · Swap: Q · Restart: R
    </footer>
  </main>
  <script>
    document.documentElement.dataset.javascript = 'enabled';
    document.querySelector('#status').textContent = 'Starting 3D runtime…';
    addEventListener('error', event => {
      const status = document.querySelector('#status');
      if (status) status.textContent = `STARTUP ERROR · ${event.message || 'module failed to load'}`;
    });
    addEventListener('unhandledrejection', event => {
      const status = document.querySelector('#status');
      const detail = event.reason?.message || String(event.reason || 'asset promise rejected');
      if (status) status.textContent = `ASSET ERROR · ${detail}`;
    });
  </script>
  <script type="module" src="src/game.js?v=living-surface-1" onerror="document.querySelector('#status').textContent='STARTUP ERROR · game module failed to load'"></script>
</body>
</html>
