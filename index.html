<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17281d">
  <title>Hargold & Mebble — Test Build</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <header class="hud">
      <div><strong>Hargold &amp; Mebble</strong><span>Modular Motion Test Build</span></div>
      <div id="status">Loading…</div>
    </header>

    <section class="game-wrap" aria-label="Playable game prototype">
      <canvas id="game" width="1280" height="720"></canvas>
      <div class="controls" aria-label="Touch controls">
        <div class="left-controls">
          <button data-action="left" aria-label="Move left">◀</button>
          <button data-action="right" aria-label="Move right">▶</button>
          <button class="utility" data-action="run" aria-label="Run">RUN</button>
        </div>
        <div class="right-controls">
          <button class="utility" data-action="restart" aria-label="Restart course">RESTART</button>
          <button data-action="swap" aria-label="Swap hero">SWAP</button>
          <button class="action" data-action="action" aria-label="Glide as Mebble or fast fall">ACTION</button>
          <button class="jump" data-action="jump" aria-label="Jump">JUMP</button>
        </div>
      </div>
    </section>

    <footer>
      Move: A/D or arrows · Run: Shift/X · Jump: Space/W/↑ · Glide/Fast fall: E/S/↓ · Swap: Q · Restart: R
    </footer>
  </main>
  <script defer src="src/game.js"></script>
</body>
</html>
