<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17281d">
  <title>Hargold &amp; Mebble — Meadow Wake 3D</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <header class="hud">
      <div><strong>Meadow Wake · World 1-1</strong><span>Twelve handcrafted outdoor rooms · layered 3D Verdant Vale</span></div>
      <div id="status">Loading 3D characters…</div>
    </header>

    <section class="game-wrap" aria-label="Playable game prototype">
      <canvas id="game" width="1280" height="720"></canvas>
      <div class="controls" aria-label="Touch controls">
        <div class="left-controls">
          <button data-action="left" aria-label="Move left">◀</button>
          <button data-action="right" aria-label="Move right">▶</button>
        </div>
        <div class="right-controls">
          <button class="utility" data-action="restart" aria-label="Restart course">RESTART</button>
          <button data-action="swap" aria-label="Swap hero">SWAP</button>
          <button class="slam" data-action="slam" aria-label="Ground slam while airborne">SLAM</button>
          <button class="action" data-action="action" aria-label="Attack or interact">ACTION</button>
          <button class="jump" data-action="jump" aria-label="Jump, air twirl, double jump, or Mebble glide">JUMP</button>
        </div>
      </div>
    </section>

    <footer>
      Move and accelerate: A/D or arrows · Jump / twirl / glide: Space/W/↑ · Ground slam or fast fall: S/↓ · Attack: E · Swap: Q · Restart: R
    </footer>
  </main>
  <script>
    document.documentElement.dataset.javascript = 'enabled';
    document.querySelector('#status').textContent = 'Starting 3D runtime…';
    addEventListener('error', event => {
      const status = document.querySelector('#status');
      if (status) status.textContent = `STARTUP ERROR · ${event.message || 'module failed to load'}`;
    });
    addEventListener('unhandledrejection', event => {
      const status = document.querySelector('#status');
      const detail = event.reason?.message || String(event.reason || 'asset promise rejected');
      if (status) status.textContent = `ASSET ERROR · ${detail}`;
    });
  </script>
  <script type="module" src="src/game.js?v=readability-pass-1" onerror="document.querySelector('#status').textContent='STARTUP ERROR · game module failed to load'"></script>
</body>
</html>
